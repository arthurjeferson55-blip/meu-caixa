<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<title>Meu Caixa</title>
<style>
:root{--bg:#05090c;--card:#0d151c;--card2:#101c25;--text:#f5f7f8;--muted:#8e9aa5;--green:#18e88b;--red:#ff4760;--gold:#f4c85b;--line:#20303b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#030609,#071017);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:88px}.top{padding:20px 18px 8px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border:2px solid var(--green);border-radius:13px;display:grid;place-items:center;font-size:22px;box-shadow:0 0 18px #18e88b33}.brand b{font-size:20px}.brand b span{color:var(--green)}.brand small{display:block;color:var(--muted);font-size:11px}.iconbtn{background:#101a21;border:1px solid var(--line);color:#fff;border-radius:12px;padding:10px}
main{padding:8px 16px}.hello{margin:8px 2px 14px}.hello h2{margin:0 0 3px;font-size:22px}.hello p{margin:0;color:var(--muted);font-size:13px}
.balance{padding:18px;border-radius:20px;background:linear-gradient(135deg,#087846,#13c879);box-shadow:0 14px 35px #00b96a26;margin-bottom:14px}.balance small{opacity:.9}.balance strong{display:block;font-size:30px;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--line);padding:12px;border-radius:15px}.stat small{color:var(--muted);display:block}.stat b{font-size:15px}.green{color:var(--green)}.red{color:var(--red)}.gold{color:var(--gold)}
.section{margin-top:22px;display:flex;justify-content:space-between;align-items:center}.section h3{margin:0}.link{color:var(--green);font-size:12px}
.list{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}.item{display:flex;align-items:center;gap:10px;padding:13px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800}.circle.in{background:#18e88b1c;color:var(--green)}.circle.out{background:#ff47601c;color:var(--red)}.item .mid{flex:1}.item b{display:block;font-size:14px}.item small{color:var(--muted)}.amount{font-weight:800}
.empty{padding:25px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:#071017ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:5}.nav{border:0;background:none;color:var(--muted);font-size:11px}.nav.active{color:var(--green)}.plus{width:48px;height:48px;border-radius:50%;margin:-23px auto 0;background:var(--green);color:#00150c;border:4px solid #071017;font-size:28px;font-weight:800}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(480px,100%);margin:auto;background:#0a1218;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin-top:0}.type{display:flex;gap:8px}.type button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff}.type .sel.in{background:#18e88b22;border-color:var(--green);color:var(--green)}.type .sel.out{background:#ff476022;border-color:var(--red);color:var(--red)}input,select{width:100%;padding:13px;margin:8px 0;background:#0d1921;border:1px solid #263946;border-radius:12px;color:#fff;font-size:15px}.save{width:100%;padding:14px;border:0;border-radius:13px;background:var(--green);font-weight:800;margin-top:8px}.close{float:right;background:none;border:0;color:#fff;font-size:22px}
.pro{margin-top:18px;padding:18px;border:1px solid #8d6b22;border-radius:18px;background:linear-gradient(135deg,#16150f,#0d1114)}.pro h3{margin:0}.pro button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--gold);font-weight:800;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">▣</div><div><b>Meu <span>Caixa</span></b><small>Seu dinheiro, no controle!</small></div></div><button class="iconbtn">♧</button></header>
<main id="content"></main>
<nav class="bottom"><button class="nav active" onclick="home()">⌂<br>Início</button><button class="nav" onclick="openModal('in')">＋<br>Lançar</button><button class="nav plus" onclick="openModal()">+</button><button class="nav" onclick="more()">☰<br>Mais</button></nav>
</div>
<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>Novo lançamento</h2><div class="type"><button id="tin" onclick="setType('in')">↑ Entrada</button><button id="tout" onclick="setType('out')">↓ Saída</button></div><input id="value" inputmode="decimal" placeholder="Valor (R$)"><input id="desc" placeholder="Descrição"><select id="cat"><option>Vendas</option><option>Serviços</option><option>Alimentação</option><option>Combustível</option><option>Material</option><option>Outros</option></select><button class="save" onclick="saveTx()">Salvar lançamento</button></div></div>
<script>
const KEY='meu_caixa_v1';let tx=JSON.parse(localStorage.getItem(KEY)||'[]');let type='in';
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function totals(){let ins=tx.filter(x=>x.type==='in').reduce((a,x)=>a+x.value,0),outs=tx.filter(x=>x.type==='out').reduce((a,x)=>a+x.value,0);return {ins,outs,balance:ins-outs}}
function home(){let t=totals();document.getElementById('content').innerHTML=`<div class="hello"><h2>Olá, Arthur 👋</h2><p>Aqui está o resumo do seu negócio hoje.</p></div><div class="balance"><small>Saldo atual</small><strong>${brl(t.balance)}</strong></div><div class="stats"><div class="stat"><small>Entradas</small><b class="green">${brl(t.ins)}</b></div><div class="stat"><small>Saídas</small><b class="red">${brl(t.outs)}</b></div><div class="stat"><small>Lucro</small><b class="gold">${brl(t.balance)}</b></div></div><div class="section"><h3>Movimentações</h3><span class="link">${tx.length} registro(s)</span></div><div class="list">${tx.length?tx.slice().reverse().map(x=>`<div class="item"><div class="circle ${x.type}">${x.type==='in'?'↑':'↓'}</div><div class="mid"><b>${escapeHtml(x.desc)}</b><small>${escapeHtml(x.cat)} · ${x.date}</small></div><div class="amount ${x.type==='in'?'green':'red'}">${x.type==='in'?'+':'-'} ${brl(x.value)}</div></div>`).join(''):'<div class="empty">Nenhuma movimentação ainda.<br>Toque no + para começar.</div>'}</div>`}
function more(){document.getElementById('content').innerHTML=`<div class="hello"><h2>Mais</h2><p>Gerencie sua conta e recursos.</p></div><div class="list"><div class="item"><div class="circle">👤</div><div class="mid"><b>Arthur</b><small>Proprietário do Meu Caixa</small></div></div><div class="item"><div class="circle">⚙</div><div class="mid"><b>Configurações</b><small>Preferências do aplicativo</small></div></div></div><div class="pro"><h3>👑 Meu Caixa <span class="gold">PRO</span></h3><p style="color:var(--muted)">Relatórios avançados, clientes, exportação e backup.</p><b>R$ 9,90/mês</b><button>Assinar agora</button></div>`}
function openModal(t='in'){document.getElementById('modal').classList.add('show');setType(t)}function closeModal(){document.getElementById('modal').classList.remove('show')}
function setType(t){type=t;document.getElementById('tin').className=t==='in'?'sel in':'';document.getElementById('tout').className=t==='out'?'sel out':''}
function saveTx(){let value=parseFloat(document.getElementById('value').value.replace(',','.'));let desc=document.getElementById('desc').value.trim();if(!value||value<=0||!desc){alert('Preencha valor e descrição.');return}tx.push({type,value,desc,cat:document.getElementById('cat').value,date:new Date().toLocaleDateString('pt-BR')});localStorage.setItem(KEY,JSON.stringify(tx));document.getElementById('value').value='';document.getElementById('desc').value='';closeModal();home()}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
home();
</script>
</body></html>
